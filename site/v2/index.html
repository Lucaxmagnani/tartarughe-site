<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Le Tartarughe Guest Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, the stay as four stops, every appliance as a numbered photo. */
:root{
  --bg:#EDF0EA; --surface:#FAFBF8; --ink:#16211C; --muted:#586760; --line:#D3D9D0;
  --accent:#1D6959; --accent-ink:#FFFFFF; --accent-soft:#DCE9E3;
  --mark:#D8951F; --mark-ink:#1B1403; --warn:#A63C28; --warn-soft:#F6E3DD;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --r:14px; --gap:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111815; --surface:#1A2320; --ink:#EBEFE8; --muted:#9BA9A1; --line:#2B3632;
    --accent:#62C4AA; --accent-ink:#0B1512; --accent-soft:#1F332D;
    --mark:#EBAA3C; --mark-ink:#1B1403; --warn:#F2907A; --warn-soft:#3A211B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1A2320; --ink:#EBEFE8; --muted:#9BA9A1; --line:#2B3632;
  --accent:#62C4AA; --accent-ink:#0B1512; --accent-soft:#1F332D;
  --mark:#EBAA3C; --mark-ink:#1B1403; --warn:#F2907A; --warn-soft:#3A211B; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding:0 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font:700 17px var(--display);color:var(--ink);text-decoration:none;letter-spacing:.01em}
.brand small{display:block;font:400 12px var(--body);color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.view{display:flex;flex-direction:column;gap:22px}
.lead{color:var(--muted)}
.hero{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.hero img{width:100%;height:132px;object-fit:cover}
.hero .in{padding:16px}
.hero .addr{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dates input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.now{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.now .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.now a.go{align-self:flex-start;background:var(--accent-ink);color:var(--accent);text-decoration:none;font-weight:600;padding:9px 14px;border-radius:999px}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stops li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.stops li:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.stops .num{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 15px var(--display);background:var(--surface)}
.stops li.cur .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stops a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stops li.cur a{border-color:var(--accent)}
.stops a span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.rows > *{padding:13px 15px;border-top:1px solid var(--line)}
.rows > *:first-child{border-top:0}
a.row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:inherit}
a.row b{font-weight:600;display:block}
a.row small{color:var(--muted);font-size:13.5px;display:block}
a.row::after{content:"›";color:var(--accent);font-size:22px;line-height:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec > h2{margin-top:2px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
code.ssid{font:600 16px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prose{font-size:15.5px}
.prose h4{font:500 17px var(--display);margin:0 0 4px}
.prose b{font-weight:600}
.warn{display:block;margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.note{padding:11px 13px;border-radius:12px;font-size:15px;background:var(--accent-soft)}
.note.warnbox{background:var(--warn-soft);color:var(--warn);font-weight:500}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font:700 14px var(--display);color:var(--muted);border:1.5px solid var(--line);border-radius:8px;width:26px;height:26px;display:grid;place-items:center}
ol.steps h3{margin-bottom:2px}
.mk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;border:0;background:var(--mark);color:var(--mark-ink);font:700 13px var(--display);cursor:pointer;vertical-align:1px}
.viewer{display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{border:2px solid var(--line);border-radius:10px;padding:0;background:var(--surface);cursor:pointer;overflow:hidden;width:62px;height:62px;position:relative}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button span{position:absolute;left:3px;bottom:3px;background:var(--mark);color:var(--mark-ink);font:700 11px var(--display);border-radius:999px;padding:0 6px}
.thumbs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:14px;align-items:start}
.shot[hidden]{display:none}
.spot{position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:4px solid var(--mark);box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;pointer-events:none}
.wherecap{font-size:15px}
.thumbs button{width:68px}
.shot.tall{grid-template-columns:minmax(128px,38%) 1fr}
.shot.port .scroller{max-width:400px;margin:0 auto;width:100%}
.scroller{overflow-x:auto;min-width:0}
.frame{position:relative;width:100%}
.shot.wide .frame{min-width:560px}
.frame img{width:100%;height:auto;border-radius:8px}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--mark-ink);font:700 14px var(--display);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:pointer;padding:0}
.shot.tall .pin{width:22px;height:22px;font-size:12.5px}
.pin.on{outline:3px solid var(--accent);outline-offset:2px;transform:translate(-50%,-50%) scale(1.2)}
@media (prefers-reduced-motion:no-preference){.pin{transition:transform .15s}}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px 14px;font-size:14.5px}
.shot.tall .legend{grid-template-columns:1fr}
.legend li{display:flex;gap:8px;align-items:baseline}
.legend li.on{font-weight:600}
.apnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px;padding:8px 0;position:sticky;top:0;z-index:4;background:var(--bg)}
.apnav a{display:grid;place-items:center;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--muted)}
.apnav a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tiles a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:86px;padding:10px 6px;text-align:center;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;line-height:1.2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tiles a .ico{width:28px;height:28px;color:var(--accent)}
.yt{width:min(100%,300px);aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;background:#000}
.yt iframe{width:100%;height:100%;border:0;display:block}
.prose ul{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.prose h4:not(:first-child){margin-top:14px}
.prose p{margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:500;cursor:pointer}
.chips button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{align-self:flex-start;text-decoration:none;font-weight:600;font-size:14.5px}
.meta{color:var(--muted);font-size:14px}
.place{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.place b{font-weight:600}
.place small{display:block;color:var(--muted);font-size:13.5px}
.place a{white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.place .links{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.keys{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.keys img{border-radius:10px}
.keys ul{margin:0;padding-left:18px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
nav.tabs div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 11px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.ev.alert{border-color:var(--warn);border-left-width:5px}
.ev .when{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.ev.alert .when{color:var(--warn)}
#sub-email{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:14.5px}
.ck input{margin-top:4px;width:17px;height:17px;flex:none}
.card.out{border-color:var(--mark);border-left-width:5px;display:flex;flex-direction:column;gap:6px}
.host{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
@media (max-width:380px){.keys{grid-template-columns:1fr}.dates{grid-template-columns:1fr}}
</style>
</head>

  var tags={stay_start:s.from.replace(/-/g,""),stay_end:s.to.replace(/-/g,""),lang:lang==="it"?"it":"en"};
  window.OneSignalDeferred.push(function(OneSignal){
    var job=push?OneSignal.Notifications.requestPermission().then(function(){return OneSignal.User.addTags(tags)}).then(function(){subMsg(OneSignal.Notifications.permission?u.push_ok:u.push_no)})
                :Promise.resolve(OneSignal.User.addEmail(em)).then(function(){return OneSignal.User.addTags(tags)}).then(function(){store.set("lt_subscribed",em);subMsg(u.sub_ok)});
